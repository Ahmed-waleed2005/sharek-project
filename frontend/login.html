<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول | شارك</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
<div id="navbar"></div>

<div class="auth-wrap">
  <h2>تسجيل الدخول</h2>
  <p class="sub">سعداء بعودتك! سجّل الدخول لمتابعة مبادراتك</p>

  <form id="login-form">
    <div class="form-field">
      <label>البريد الإلكتروني</label>
      <input type="email" name="email" required placeholder="example@mail.com" />
    </div>
    <div class="form-field">
      <label>كلمة المرور</label>
      <input type="password" name="password" required placeholder="••••••••" />
    </div>
    <button class="btn btn-primary btn-block" type="submit">تسجيل الدخول</button>
    <p class="form-msg" id="form-msg"></p>
  </form>

  <p class="form-msg">ليس لديك حساب؟ <a href="register.html" style="color:var(--green-dark);font-weight:700;">إنشاء حساب جديد</a></p>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.textContent = '';
  const form = new FormData(e.target);
  try {
    const res = await api.login(Object.fromEntries(form.entries()));
    setSession(res.accessToken, res.user);
    showToast('تم تسجيل الدخول بنجاح');
    setTimeout(() => (window.location.href = 'index.html'), 500);
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = 'var(--danger)';
  }
});
</script>
</body>
</html>
