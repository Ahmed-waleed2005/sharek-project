<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تفاصيل المبادرة | شارك</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="initiatives">
<div id="navbar"></div>

<header class="page-header" style="padding-bottom:100px;">
  <div class="container">
    <a href="initiatives.html" style="color:#d7e6de;font-size:.9rem;">← رجوع للمبادرات</a>
  </div>
</header>

<div class="container">
  <div class="details-grid" id="details-root">
    <p style="color:var(--muted);">جارِ التحميل ...</p>
  </div>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
const id = new URLSearchParams(window.location.search).get('id');

function statusBadge(item) {
  const enrolled = item.enrolledCount || 0;
  const full = item.capacity && enrolled >= item.capacity;
  return full ? 'اكتمل العدد' : 'مفتوح للتسجيل';
}

async function loadDetails() {
  const root = document.getElementById('details-root');
  if (!id) {
    root.innerHTML = `<div class="empty-state">لم يتم تحديد المبادرة</div>`;
    return;
  }
  try {
    const item = await api.initiative(id);
    const enrolled = item.enrolledCount || 0;
    const pct = item.capacity ? Math.min(100, Math.round((enrolled / item.capacity) * 100)) : 0;
    const user = getCurrentUser();
    const img = item.imageUrl || `https://source.unsplash.com/900x500/?volunteer,${item.category?.slug || 'community'}`;

    root.innerHTML = `
      <div>
        <div class="details-hero">
          <div class="thumb" style="background-image:url('${img}')"></div>
          <div class="info">
            <span class="badge">${escapeHtml(item.category?.name || '')}</span>
            <h1>${escapeHtml(item.title)}</h1>
            <div class="meta-row">
              <span>📍 ${escapeHtml(item.city)} - ${escapeHtml(item.location)}</span>
              <span>📅 ${formatDate(item.eventDate)}</span>
              <span>⏰ ${formatTime(item.eventTime)}</span>
            </div>
            <div class="progress-row">
              <span>${enrolled} / ${item.capacity} منضم</span>
              <div class="progress-bar"><div style="width:${pct}%"></div></div>
              <span>${statusBadge(item)}</span>
            </div>
          </div>
        </div>

        <div class="card-box">
          <h4>وصف المبادرة</h4>
          <p style="color:#3d4a44;">${escapeHtml(item.description)}</p>
        </div>

        ${item.requirements ? `
        <div class="card-box">
          <h4>المتطلبات</h4>
          <p style="color:#3d4a44;">${escapeHtml(item.requirements)}</p>
        </div>` : ''}

        ${item.benefits ? `
        <div class="card-box">
          <h4>ما ستكسبه من المشاركة</h4>
          <p style="color:#3d4a44;">${escapeHtml(item.benefits)}</p>
        </div>` : ''}
      </div>

      <div>
        <div class="sidebar-join">
          <div class="card-box">
            <h4>معلومات المبادرة</h4>
            <ul class="info-list">
              <li><span class="ic">🗂️</span> نوع المبادرة: ${escapeHtml(item.category?.name || '')}</li>
              <li><span class="ic">📍</span> الجهة المنظمة: ${escapeHtml(item.organizer?.fullName || '')}</li>
              <li><span class="ic">👥</span> السعة: ${item.capacity} متطوع</li>
              <li><span class="ic">📍</span> الموقع: ${escapeHtml(item.city)}</li>
            </ul>
          </div>

          <div class="card-box">
            <button class="btn btn-primary btn-block" id="join-btn">انضم للمبادرة</button>
            <p class="form-msg" id="join-msg"></p>
            <div class="avatars-row">
              ${Array.from({ length: Math.min(5, enrolled || 0) })
                .map((_, i) => `<div class="av">${i + 1}</div>`)
                .join('')}
              ${enrolled > 5 ? `<span style="margin-inline-start:10px;font-size:.8rem;color:var(--muted);">+${enrolled - 5}</span>` : ''}
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('join-btn').addEventListener('click', async () => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      try {
        await api.joinInitiative(id);
        showToast('تم الانضمام للمبادرة بنجاح 🎉');
        loadDetails();
      } catch (e) {
        document.getElementById('join-msg').textContent = e.message;
        document.getElementById('join-msg').style.color = 'var(--danger)';
      }
    });
  } catch (e) {
    root.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">تعذر تحميل المبادرة: ${e.message}</div>`;
  }
}
loadDetails();
</script>
</body>
</html>
