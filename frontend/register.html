<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إنشاء حساب | شارك</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
<div id="navbar"></div>

<div class="auth-wrap">
  <h2>إنشاء حساب جديد</h2>
  <p class="sub">انضم لمجتمع المتطوعين وابدأ التأثير في مجتمعك</p>

  <form id="register-form">
    <div class="form-field">
      <label>الاسم الكامل</label>
      <input type="text" name="fullName" required placeholder="اسمك بالكامل" />
    </div>
    <div class="form-field">
      <label>البريد الإلكتروني</label>
      <input type="email" name="email" required placeholder="example@mail.com" />
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>رقم الهاتف (اختياري)</label>
        <input type="tel" name="phone" placeholder="01xxxxxxxxx" />
      </div>
      <div class="form-field">
        <label>المدينة (اختياري)</label>
        <input type="text" name="city" placeholder="القاهرة" />
      </div>
    </div>
    <div class="form-field">
      <label>كلمة المرور</label>
      <input type="password" name="password" required minlength="6" placeholder="6 أحرف على الأقل" />
    </div>
    <div class="form-field">
      <label>نوع الحساب</label>
      <select name="role">
        <option value="volunteer">متطوع - أبحث عن مبادرات للانضمام إليها</option>
        <option value="organizer">منظم - أريد إنشاء ونشر مبادرات</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" type="submit">إنشاء الحساب</button>
    <p class="form-msg" id="form-msg"></p>
  </form>

  <p class="form-msg">لديك حساب بالفعل؟ <a href="login.html" style="color:var(--green-dark);font-weight:700;">تسجيل الدخول</a></p>
</div>

<div id="footer"></div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('form-msg');
  msg.textContent = '';
  const form = new FormData(e.target);
  const payload = Object.fromEntries(form.entries());
  if (!payload.phone) delete payload.phone;
  if (!payload.city) delete payload.city;
  try {
    const res = await api.register(payload);
    setSession(res.accessToken, res.user);
    showToast('تم إنشاء الحساب بنجاح 🎉');
    setTimeout(() => (window.location.href = 'index.html'), 600);
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = 'var(--danger)';
  }
});
</script>
</body>
</html>
